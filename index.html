<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видеотека - Детальные карточки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .add-form {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-box input, .search-box select {
            flex: 1;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.02);
        }
        .movie-poster {
            height: 200px;
            position: relative;
            background-color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-poster .no-poster {
            font-size: 50px;
            color: white;
        }
        .movie-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: gold;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 2;
        }
        .movie-content {
            padding: 15px;
        }
        .movie-title {
            font-size: 18px;
            font-weight: bold;
        }
        .movie-director {
            color: #667eea;
            font-size: 14px;
            margin: 5px 0;
        }
        .movie-year, .movie-genre {
            display: inline-block;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 5px;
        }
        .movie-description {
            font-size: 13px;
            color: #666;
            margin: 10px 0;
        }
        .btn-delete {
            background: #ff4757;
            width: 100%;
            margin-top: 10px;
        }
        
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
        }
        .modal-content {
            background: white;
            margin: 30px auto;
            max-width: 550px;
            width: 90%;
            border-radius: 20px;
            overflow: hidden;
        }
        .modal-poster {
            height: 350px;
            background-color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .modal-poster img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a2e;
        }
        .modal-poster .no-poster {
            font-size: 80px;
            color: white;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 35px;
            cursor: pointer;
            color: white;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .stats {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
        }
        .test-posters {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
        }
        .test-posters a {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📽️ Видеотека</h1>
            <p>Нажмите на карточку фильма — откроются детали</p>
        </div>

        <div class="add-form">
            <h3>➕ Добавить фильм</h3>
            <div class="form-grid">
                <input type="text" id="title" placeholder="Название">
                <input type="text" id="director" placeholder="Режиссер">
                <input type="number" id="year" placeholder="Год">
                <select id="genre">
                    <option>Боевик</option><option>Комедия</option><option>Драма</option>
                    <option>Фантастика</option><option>Ужасы</option><option>Триллер</option>
                </select>
                <input type="number" id="rating" step="0.1" placeholder="Рейтинг">
            </div>
            <textarea id="description" rows="2" placeholder="Описание"></textarea>
            <input type="text" id="poster" placeholder="Ссылка на постер (URL картинки)">
            <button onclick="addMovie()">Добавить фильм</button>
            
            <div class="test-posters">
                📸 <strong>Готовые ссылки для теста (нажмите, чтобы вставить):</strong><br>
                <a onclick="document.getElementById('poster').value='https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg'">Побег из Шоушенка</a>
                <a onclick="document.getElementById('poster').value='https://image.tmdb.org/t/p/w500/rPdtLWNsZmAtoZl9PK7S2wE3qiS.jpg'">Крестный отец</a>
                <a onclick="document.getElementById('poster').value='https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg'">Темный рыцарь</a>
                <a onclick="document.getElementById('poster').value='https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg'">Матрица</a>
            </div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск..." onkeyup="filterMovies()">
                <select id="genreFilter" onchange="filterMovies()">
                    <option value="">Все жанры</option>
                    <option>Боевик</option><option>Комедия</option><option>Драма</option>
                    <option>Фантастика</option><option>Ужасы</option><option>Триллер</option>
                </select>
            </div>
            <div class="stats" id="stats">Фильмов: 0</div>
        </div>

        <div id="moviesContainer" class="movies-grid">
            <div class="empty-state">🎬 Нет фильмов. Добавьте первый!</div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalPoster" class="modal-poster"></div>
            <span class="modal-close" onclick="closeModal()">✕</span>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p id="modalDirector"></p>
                <p><span id="modalYear"></span> | <span id="modalGenre"></span> | ⭐ <span id="modalRating"></span></p>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <script>
        // 👇 ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ ИЗ RENDER!
        const API_URL = 'https://videoteka-1.onrender.com';
        
        let allMovies = [];

        async function loadMovies() {
            try {
                const res = await fetch(`${API_URL}/movies`);
                allMovies = await res.json();
                filterMovies();
            } catch(e) {
                document.getElementById('moviesContainer').innerHTML = '<div class="empty-state">❌ Ошибка подключения к серверу</div>';
            }
        }

        function filterMovies() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            let filtered = allMovies.filter(m => 
                m.title.toLowerCase().includes(search) && (!genre || m.genre === genre)
            );
            document.getElementById('stats').innerHTML = `📊 Найдено: ${filtered.length} | Всего: ${allMovies.length}`;
            renderMovies(filtered);
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            if (movies.length === 0) {
                container.innerHTML = '<div class="empty-state">🎬 Фильмы не найдены</div>';
                return;
            }
            container.innerHTML = movies.map(m => `
                <div class="movie-card" onclick="openModal(${m.id})">
                    <div class="movie-poster">
                        ${m.poster ? `<img src="${m.poster}" onerror="this.style.display='none'; this.nextSibling.style.display='flex'" loading="lazy">` : ''}
                        <div class="no-poster" style="${m.poster ? 'display: none;' : 'display: flex;'}">🎬</div>
                        <div class="movie-rating">⭐ ${m.rating}</div>
                    </div>
                    <div class="movie-content">
                        <div class="movie-title">${escapeHtml(m.title)}</div>
                        <div class="movie-director">🎬 ${escapeHtml(m.director)}</div>
                        <div>
                            <span class="movie-year">📅 ${m.year}</span>
                            <span class="movie-genre">🎭 ${escapeHtml(m.genre)}</span>
                        </div>
                        <div class="movie-description">${escapeHtml((m.description || 'Описание отсутствует').substring(0, 80))}${(m.description || '').length > 80 ? '...' : ''}</div>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteMovie(${m.id})">🗑 Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        window.openModal = function(movieId) {
            const movie = allMovies.find(m => m.id === movieId);
            if (!movie) return;
            
            document.getElementById('modalTitle').innerHTML = movie.title;
            document.getElementById('modalDirector').innerHTML = `🎬 Режиссер: ${movie.director}`;
            document.getElementById('modalYear').innerHTML = `📅 ${movie.year}`;
            document.getElementById('modalGenre').innerHTML = `🎭 ${movie.genre}`;
            document.getElementById('modalRating').innerHTML = movie.rating;
            document.getElementById('modalDescription').innerHTML = movie.description || 'Описание отсутствует';
            
            const posterEl = document.getElementById('modalPoster');
            if (movie.poster) {
                posterEl.innerHTML = `<img src="${movie.poster}" onerror="this.style.display='none'; this.nextSibling.style.display='flex'" loading="lazy"><div class="no-poster" style="display: none;">🎬</div>`;
            } else {
                posterEl.innerHTML = `<div class="no-poster" style="display: flex;">🎬</div>`;
            }
            
            document.getElementById('modal').style.display = 'block';
        };

        window.closeModal = function() {
            document.getElementById('modal').style.display = 'none';
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function addMovie() {
            const movie = {
                title: document.getElementById('title').value,
                director: document.getElementById('director').value,
                year: parseInt(document.getElementById('year').value),
                genre: document.getElementById('genre').value,
                rating: parseFloat(document.getElementById('rating').value),
                description: document.getElementById('description').value,
                poster: document.getElementById('poster').value
            };
            if (!movie.title || !movie.director || !movie.year || !movie.rating) {
                alert('Заполните обязательные поля!');
                return;
            }
            await fetch(`${API_URL}/movies`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(movie)
            });
            document.querySelectorAll('input, textarea').forEach(i => i.value = '');
            document.getElementById('genre').value = 'Боевик';
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm('Удалить фильм?')) {
                await fetch(`${API_URL}/movies/${id}`, {method: 'DELETE'});
                loadMovies();
            }
        }

        loadMovies();
    </script>
</body>
</html>
