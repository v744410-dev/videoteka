<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видеотека - Справочная система</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Контейнер с отступами для полос */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: 100px;
            padding-left: 100px;
            padding-right: 100px;
            padding-bottom: 20px;
        }

        /* Верхняя полоса с кадрами */
        .top-film-strip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #000;
            display: flex;
            z-index: 100;
            gap: 2px;
            overflow: hidden;
        }

        .film-frame {
            min-width: 180px;
            height: 100px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        /* Левая полоса */
        .left-film-strip {
            position: fixed;
            left: 0;
            top: 100px;
            width: 100px;
            height: calc(100vh - 100px);
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 100;
            gap: 2px;
            overflow: hidden;
        }

        /* Правая полоса */
        .right-film-strip {
            position: fixed;
            right: 0;
            top: 100px;
            width: 100px;
            height: calc(100vh - 100px);
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 100;
            gap: 2px;
            overflow: hidden;
        }

        .vertical-frame {
            min-height: 150px;
            width: 100%;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            z-index: 50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* Форма добавления */
        .add-form {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .add-form h2 {
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row .field {
            flex: 1;
            min-width: 150px;
        }

        .form-row .field-full {
            width: 100%;
        }

        .field input, .field select, .field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 13px;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        /* Поиск */
        .search-section {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .search-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .search-row input, .search-row select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .stats {
            color: #666;
            font-size: 14px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        /* Сетка фильмов */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            height: 200px;
            background-size: cover;
            background-position: center;
            background-color: #667eea;
            position: relative;
        }

        .movie-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: gold;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        .movie-content {
            padding: 15px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .movie-director {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .movie-year, .movie-genre {
            display: inline-block;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            max-width: 500px;
            width: 90%;
            border-radius: 15px;
            overflow: hidden;
        }

        .modal-poster {
            height: 300px;
            background-size: cover;
            background-position: center;
            background-color: #667eea;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <!-- Верхняя полоса с кадрами -->
    <div class="top-film-strip" id="topStrip"></div>

    <!-- Левая полоса -->
    <div class="left-film-strip" id="leftStrip"></div>

    <!-- Правая полоса -->
    <div class="right-film-strip" id="rightStrip"></div>

    <!-- Основной контент -->
    <div class="page-wrapper">
        <div class="main-content">
            <div class="container">
                <div class="header">
                    <h1>📽️ Видеотека</h1>
                    <p>Справочно-информационная система фильмов</p>
                </div>

                <!-- ФОРМА ДОБАВЛЕНИЯ (исправлено расположение) -->
                <div class="add-form">
                    <h2>➕ Добавить фильм</h2>
                    
                    <div class="form-row">
                        <div class="field">
                            <label>🎬 Название</label>
                            <input type="text" id="title" placeholder="Введите название">
                        </div>
                        <div class="field">
                            <label>🎭 Жанр</label>
                            <select id="genre">
                                <option>Боевик</option>
                                <option>Комедия</option>
                                <option>Драма</option>
                                <option>Фантастика</option>
                                <option>Ужасы</option>
                                <option>Триллер</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label>🎬 Режиссер</label>
                            <input type="text" id="director" placeholder="ФИО режиссера">
                        </div>
                        <div class="field">
                            <label>📅 Год</label>
                            <input type="number" id="year" placeholder="Год выпуска">
                        </div>
                        <div class="field">
                            <label>⭐ Рейтинг</label>
                            <input type="number" id="rating" step="0.1" placeholder="0-10">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field-full">
                            <label>📝 Описание</label>
                            <textarea id="description" rows="2" placeholder="Краткое описание фильма..."></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field-full">
                            <label>🖼️ Ссылка на постер</label>
                            <input type="text" id="poster" placeholder="https://...">
                        </div>
                    </div>

                    <button class="btn-add" onclick="addMovie()">➕ Добавить фильм</button>
                </div>

                <!-- ПОИСК -->
                <div class="search-section">
                    <div class="search-row">
                        <input type="text" id="searchInput" placeholder="🔍 Поиск по названию..." onkeyup="filterMovies()">
                        <select id="genreFilter" onchange="filterMovies()">
                            <option value="">Все жанры</option>
                            <option>Боевик</option>
                            <option>Комедия</option>
                            <option>Драма</option>
                            <option>Фантастика</option>
                            <option>Ужасы</option>
                            <option>Триллер</option>
                        </select>
                    </div>
                    <div class="stats" id="stats">Фильмов: 0</div>
                </div>

                <!-- СПИСОК ФИЛЬМОВ -->
                <div id="moviesContainer" class="movies-grid">
                    <div class="empty-state">🎬 Нет фильмов. Добавьте первый!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalPoster" class="modal-poster"></div>
            <div class="modal-body">
                <span class="modal-close" onclick="closeModal()">✕</span>
                <h2 id="modalTitle"></h2>
                <p id="modalDirector"></p>
                <p>⭐ <span id="modalRating"></span> | 📅 <span id="modalYear"></span> | 🎭 <span id="modalGenre"></span></p>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://videoteka-1.onrender.com';
        let allMovies = [];

        // КАДРЫ ДЛЯ ФОНА (замените на свои ссылки)
        const filmFrames = [
            'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300',
            'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300',
            'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300',
            'https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=300',
            'https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=300',
            'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=300'
        ];

        function initFilmStrips() {
            const topStrip = document.getElementById('topStrip');
            const leftStrip = document.getElementById('leftStrip');
            const rightStrip = document.getElementById('rightStrip');

            topStrip.innerHTML = '';
            leftStrip.innerHTML = '';
            rightStrip.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                const frame = document.createElement('div');
                frame.className = 'film-frame';
                frame.style.backgroundImage = `url(${filmFrames[i % filmFrames.length]})`;
                topStrip.appendChild(frame);
            }

            for (let i = 0; i < 4; i++) {
                const frame = document.createElement('div');
                frame.className = 'vertical-frame';
                frame.style.backgroundImage = `url(${filmFrames[(i + 2) % filmFrames.length]})`;
                leftStrip.appendChild(frame);
            }

            for (let i = 0; i < 4; i++) {
                const frame = document.createElement('div');
                frame.className = 'vertical-frame';
                frame.style.backgroundImage = `url(${filmFrames[(i + 4) % filmFrames.length]})`;
                rightStrip.appendChild(frame);
            }
        }

        async function loadMovies() {
            try {
                const res = await fetch(`${API_URL}/movies`);
                allMovies = await res.json();
                filterMovies();
            } catch(e) {
                document.getElementById('moviesContainer').innerHTML = '<div class="empty-state">❌ Ошибка подключения</div>';
            }
        }

        function filterMovies() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            let filtered = allMovies.filter(m => 
                m.title.toLowerCase().includes(search) && (!genre || m.genre === genre)
            );
            document.getElementById('stats').innerHTML = `📊 Найдено: ${filtered.length} | Всего: ${allMovies.length}`;
            renderMovies(filtered);
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            if (movies.length === 0) {
                container.innerHTML = '<div class="empty-state">🎬 Фильмы не найдены</div>';
                return;
            }
            container.innerHTML = movies.map(m => `
                <div class="movie-card" onclick="openModal(${m.id})">
                    <div class="movie-poster" style="background-image: url('${m.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300'}')">
                        <div class="movie-rating">⭐ ${m.rating}</div>
                    </div>
                    <div class="movie-content">
                        <div class="movie-title">${escapeHtml(m.title)}</div>
                        <div class="movie-director">🎬 ${escapeHtml(m.director)}</div>
                        <span class="movie-year">📅 ${m.year}</span>
                        <span class="movie-genre">🎭 ${escapeHtml(m.genre)}</span>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteMovie(${m.id})">🗑 Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        window.openModal = function(movieId) {
            const m = allMovies.find(m => m.id === movieId);
            if (!m) return;
            document.getElementById('modalTitle').innerHTML = m.title;
            document.getElementById('modalDirector').innerHTML = `Режиссер: ${m.director}`;
            document.getElementById('modalYear').innerHTML = m.year;
            document.getElementById('modalGenre').innerHTML = m.genre;
            document.getElementById('modalRating').innerHTML = m.rating;
            document.getElementById('modalDescription').innerHTML = m.description || 'Описание отсутствует';
            document.getElementById('modalPoster').style.backgroundImage = `url('${m.poster || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300'}')`;
            document.getElementById('modal').style.display = 'block';
        };

        window.closeModal = () => document.getElementById('modal').style.display = 'none';

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addMovie() {
            const movie = {
                title: document.getElementById('title').value,
                director: document.getElementById('director').value,
                year: parseInt(document.getElementById('year').value),
                genre: document.getElementById('genre').value,
                rating: parseFloat(document.getElementById('rating').value),
                description: document.getElementById('description').value,
                poster: document.getElementById('poster').value
            };
            if (!movie.title || !movie.director || !movie.year || !movie.rating) {
                alert('Заполните все поля!');
                return;
            }
            await fetch(`${API_URL}/movies`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(movie)
            });
            document.getElementById('title').value = '';
            document.getElementById('director').value = '';
            document.getElementById('year').value = '';
            document.getElementById('rating').value = '';
            document.getElementById('description').value = '';
            document.getElementById('poster').value = '';
            document.getElementById('genre').value = 'Боевик';
            loadMovies();
        }

        async function deleteMovie(id) {
            if (confirm('Удалить фильм?')) {
                await fetch(`${API_URL}/movies/${id}`, {method: 'DELETE'});
                loadMovies();
            }
        }

        initFilmStrips();
        loadMovies();
    </script>
</body>
</html>
